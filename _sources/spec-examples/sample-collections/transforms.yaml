transforms:
- id: ttl-to-jsonld
  description: Frames the root resource (SampleCollection) of a SOSA Turtle example and compacts it with the `ogc.sosa.properties.sampleCollection`
    JSON-LD context. The output is validated against `ogc.sosa.properties.sampleCollection`.
  type: python
  ref: ../transforms/ttl_to_sosa_json.py
  inputs:
    mediaTypes:
    - text/turtle
  outputs:
    mediaTypes:
    - mimeType: application/json
      defaultExtension: json
    profiles:
    - bblocks://ogc.sosa.properties.sampleCollection
  metadata:
    rootClasses:
    - http://www.w3.org/ns/sosa/SampleCollection
    containerClasses:
    - http://www.w3.org/ns/sosa/ObservationCollection
    - http://www.w3.org/ns/sosa/SampleCollection
    suppressTerms:
    - features
