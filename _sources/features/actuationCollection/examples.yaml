- title: Example of a SOSA ActuationCollection Feature
  content: |-
    The specification has no dedicated ActuationCollection example instance. This
    extends the "open-window" Actuation example with a second sibling Actuation on
    another window, sharing the same Actuator, as a GeoJSON FeatureCollection.
  snippets:
    - language: json
      code: |-
        {
          "type": "FeatureCollection",
          "properties": {
            "madeByActuator": "closer-987"
          },
          "features": [
            {
              "@id": "A188",
              "type": "Feature",
              "geometry": null,
              "properties": {
                "actsOnProperty": "window98/openState",
                "hasSimpleResult": true,
                "startTime": "2017-04-18T17:23:00+02:00",
                "endTime": "2017-04-18T17:24:00+02:00"
              }
            },
            {
              "@id": "A189",
              "type": "Feature",
              "geometry": null,
              "properties": {
                "actsOnProperty": "window99/openState",
                "hasSimpleResult": false,
                "startTime": "2017-04-18T17:25:00+02:00",
                "endTime": "2017-04-18T17:25:30+02:00"
              }
            }
          ]
        }
      base-uri: https://example.org/data/open-window/
