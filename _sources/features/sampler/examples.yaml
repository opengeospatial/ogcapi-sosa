- title: Example of a SOSA Sampler Feature
  content: |-
    From the SOSA/SSN specification's "PlannedDeployment" example, as a GeoJSON feature.
  snippets:
    - language: json
      code: |-
        {
          "@id": "SA56",
          "type": "Feature",
          "geometry": null,
          "properties": {
            "implements": "Sp-A56",
            "isHostedBy": "LOIRE_A_JARGEAU_WQ_Station"
          }
        }
      base-uri: https://example.org/data/
