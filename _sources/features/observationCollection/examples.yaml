- title: Example of SOSA ObservationCollection
  comment:
    This class is a target for the SOSA v 1.1 update. 

  snippets:


    - language: json
      ref: examples/observationCollection.json
      base-uri: http://www.example.com/sosa/col#

    - language: turtle
      code: |-
        @prefix sosa: <http://www.w3.org/ns/sosa/> .
        @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
        @prefix eg: <http://example.org/my-feature/> .
        @prefix skos: <http://www.w3.org/2004/02/skos/core#> .

        eg:c1 a sosa:ObservationCollection ;
          sosa:hasMember eg:pop1999, eg:pop2000 ;
          sosa:observedProperty <http://dbpedia.org/ontology/population> ;
        .

        eg:pop1999 a sosa:Observation ;
          sosa:hasFeatureOfInterest <https://demo.pygeoapi.io/master/collections/utah_city_locations/items/Salem> ;
          sosa:hasSimpleResult 3275.0 ;
          sosa:resultTime "1999-01-01"^^xsd:date
        .

         eg:pop2000 a sosa:Observation ;
          sosa:hasFeatureOfInterest <https://demo.pygeoapi.io/master/collections/utah_city_locations/items/Salem> ;
          sosa:hasSimpleResult 4372.0 ;
          sosa:resultTime "2000"^^xsd:gYear
        .

        <http://dbpedia.org/ontology/population> a skos:Concept;
          skos:prefLabel "Population";
        .


- title: Example of nested SOSA ObservationCollections with an inline Feature of Interest geometry
  comment: |-
    An ObservationCollection Feature's `features` array can itself contain nested
    ObservationCollection Features, not just individual Observations - a
    FeatureCollection cannot appear as a `features` member, so each nested
    collection is a `Feature` whose members are held in `properties.hasMember`
    rather than a further `features` array. Common properties are held at the
    level of the collection that shares them, rather than repeated on every
    member: the outer collection declares `resultTime` and an inline
    `hasFeatureOfInterest` (with a sample `Point` geometry) shared by every
    observation in the whole tree; each inner sub-collection declares its own
    `observedProperty`, shared only by its own member observations, which in
    turn carry nothing but their individual `phenomenonTime` and result.

  snippets:
    - language: json
      ref: examples/observationCollection-foi-geometry.json
      base-uri: http://example.com/
