- title: Example of a SOSA Deployment Feature
  content: |-
    From the SOSA/SSN specification's "LocatedDeployment" example, as a GeoJSON feature.
  snippets:
    - language: json
      code: |-
        {
          "@id": "TH2-56-2024",
          "type": "Feature",
          "geometry": null,
          "properties": {
            "deployedSystem": "IBS-TH2-56",
            "deployedOnPlatform": "Room31C",
            "startTime": "2024-01-01T00:00:00+00:00",
            "endTime": "2024-12-31T23:59:59+00:00"
          }
        }
      base-uri: https://example.org/data/
