- title: Example of a SOSA Sampling Feature (air sample from Earth's atmosphere)
  content: |-
    From the SOSA/SSN specification's "LocatedSampling" example, as a GeoJSON feature.
  snippets:
    - language: json
      code: |-
        {
          "@id": "AirSampling_StE",
          "type": "Feature",
          "geometry": {
            "type": "Point",
            "coordinates": [4.387611, 45.437772]
          },
          "properties": {
            "hasFeatureOfInterest": "EarthAtmosphere",
            "hasResult": "EarthAtmosphere_StE",
            "resultTime": "2024-06-01T09:00:00Z"
          }
        }
      base-uri: https://example.org/data/
