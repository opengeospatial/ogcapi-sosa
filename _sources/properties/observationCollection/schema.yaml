"$schema": https://json-schema.org/draft/2020-12/schema
description: 'SOSA ObservationCollection'
x-jsonld-context: ../../../sosa-ssn.jsonld
$defs:
  collection:
    allOf:
      - $ref: bblocks://ogc.sosa.properties.executionCollection
      - type: object
        properties:
          observedProperty:
            $ref: '../executionCollection/schema.yaml#/$defs/references'
          madeBySensor:
            $ref: '../executionCollection/schema.yaml#/$defs/references'
          hasMember:
            type: array
            items:
              anyOf:
                - $ref: '#/$defs/collection'
                - $ref: '../observation/schema.yaml#/$defs/member'
                - $ref: bblocks://ogc.ogc-utils.iri-or-curie
allOf:
  - $ref: '#/$defs/collection'
  - not:
      anyOf:
        - required:
            - hasResult
        - required:
            - hasSimpleResult
