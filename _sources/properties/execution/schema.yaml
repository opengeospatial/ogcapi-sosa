"$schema": https://json-schema.org/draft/2020-12/schema
description: 'SOSA Execution'
x-jsonld-context: ../../../sosa-ssn.jsonld
$defs:
  # `format` is an annotation only (not asserted by the validator), so lexical forms are
  # enforced with `pattern`.
  dateTime:
    description: xsd:dateTime lexical form (time zone optional)
    type: string
    format: date-time
    pattern: '^-?[0-9]{4,}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$'
  dateTimeStamp:
    description: xsd:dateTimeStamp lexical form (time zone required)
    type: string
    format: date-time
    pattern: '^-?[0-9]{4,}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
  date:
    description: xsd:date lexical form
    type: string
    pattern: '^-?[0-9]{4,}-[0-9]{2}-[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})?$'
  reference:
    description: An IRI or CURIE, or an embedded (non-empty) object
    oneOf:
      - type: string
        minLength: 1
      - type: object
        minProperties: 1
  instant:
    description: time:Instant with at least one position
    type: object
    properties:
      inXSDDateTime:
        $ref: '#/$defs/dateTime'
      inXSDDateTimeStamp:
        $ref: '#/$defs/dateTimeStamp'
      inXSDDate:
        $ref: '#/$defs/date'
    anyOf:
      - required: [inXSDDateTime]
      - required: [inXSDDateTimeStamp]
      - required: [inXSDDate]
      - required: [inXSDgYear]
      - required: [inXSDgYearMonth]
      - required: [inTimePosition]
      - required: [id]
  temporalEntity:
    description: >-
      Time as a simple xsd:dateTime string, or a time:TemporalEntity object (e.g. a time:Interval)
      when it is not a single date-time.
    oneOf:
      - $ref: '#/$defs/dateTime'
      - type: object
        properties:
          hasBeginning:
            $ref: '#/$defs/instant'
          hasEnd:
            $ref: '#/$defs/instant'
          inXSDDateTime:
            $ref: '#/$defs/dateTime'
          inXSDDateTimeStamp:
            $ref: '#/$defs/dateTimeStamp'
          inXSDDate:
            $ref: '#/$defs/date'
        anyOf:
          - required: [hasBeginning]
          - required: [hasEnd]
          - required: [inXSDDateTime]
          - required: [inXSDDateTimeStamp]
          - required: [inXSDDate]
          - required: [inXSDgYear]
          - required: [inXSDgYearMonth]
          - required: [inTimePosition]
          - required: [id]
  simpleResult:
    description: sosa:hasSimpleResult is a literal (a JSON value, or a JSON-LD typed or language-tagged value)
    oneOf:
      - type:
          - string
          - number
          - integer
          - boolean
      - type: object
        required: ['@value']
        properties:
          '@value':
            type: [string, number, integer, boolean]
          '@type':
            type: string
          '@language':
            type: string
        additionalProperties: false
  # an Execution's mandatory properties (feature of interest, time) - required of a stand-alone
  # Observation/Actuation/Sampling, but may be provided by the collection of a collection member
  required:
    allOf:
      - required:
          - hasFeatureOfInterest
      # as the SHACL time rule: any of resultTime, phenomenonTime, startTime, endTime
      - anyOf:
          - required: [resultTime]
          - required: [phenomenonTime]
          - required: [startTime]
          - required: [endTime]
  # exactly one result: required of every Observation/Actuation/Sampling, collection member or not
  result:
    oneOf:
      - required: [hasResult]
      - required: [hasSimpleResult]
type: object
properties:
  resultTime:
    $ref: '#/$defs/dateTime'
  phenomenonTime:
    $ref: '#/$defs/temporalEntity'
  hasFeatureOfInterest:
    $ref: '#/$defs/reference'
  hasUltimateFeatureOfInterest:
    $ref: '#/$defs/reference'
  usedProcedure:
    $ref: '#/$defs/reference'
  startTime:
    $ref: '#/$defs/dateTime'
  endTime:
    $ref: '#/$defs/dateTime'
  hasResult:
    $ref: '#/$defs/reference'
  result: true
  result@links: true
  hasSimpleResult:
    $ref: '#/$defs/simpleResult'
  hasInputValue: true
